name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Syntax check
        run: zsh -n wt.zsh wt.plugin.zsh

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          repo="$tmpdir/repo"
          mkdir -p "$repo"
          cd "$repo"

          git init -q
          git config user.name "CI"
          git config user.email "ci@example.com"
          echo init > README.md
          git add README.md
          git commit -q -m init

          # Untracked files in the main worktree; wt should copy only safe files by default.
          echo safe > .nvmrc
          echo secret > .env

          zsh -c "source '$GITHUB_WORKSPACE/wt.zsh'; wt feature/test >/dev/null; \
            test \"\$(git branch --show-current)\" = feature/test; \
            test -f .nvmrc; \
            test ! -f .env"

          test "$(WT_BRANCH_PREFIX='custom/' zsh -c "source '$GITHUB_WORKSPACE/wt.zsh'; _wt_branch_prefix")" = 'custom/'
          test "$(WT_BRANCH_PREFIX='' zsh -c "source '$GITHUB_WORKSPACE/wt.zsh'; _wt_branch_prefix")" = ''
          test "$(WT_BRANCH_PREFIX='custom/' zsh -c "
            source '$GITHUB_WORKSPACE/wt.zsh'
            fzf() {
              [[ \"\$*\" == *'--query=custom/'* ]] || return 1
              print -r -- 'custom/new-feature'
              return 1
            }
            _wt_prompt_for_branch
          ")" = 'custom/new-feature'

          git config wt.branchPrefix 'team/'
          test "$(zsh -c "source '$GITHUB_WORKSPACE/wt.zsh'; _wt_branch_prefix")" = 'team/'
          git config --unset wt.branchPrefix

          mkdir -p "$tmpdir/bin"
          printf '%s\n' '#!/bin/sh' 'echo RyanJamesCaldwell' > "$tmpdir/bin/gh"
          chmod +x "$tmpdir/bin/gh"
          test "$(PATH="$tmpdir/bin:$PATH" zsh -c "source '$GITHUB_WORKSPACE/wt.zsh'; _wt_branch_prefix")" = 'ryanjamescaldwell/'
