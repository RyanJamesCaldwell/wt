name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Syntax check
        run: zsh -n wt.zsh wt.plugin.zsh

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          repo="$tmpdir/repo"
          mkdir -p "$repo"
          cd "$repo"

          git init -q
          git config user.name "CI"
          git config user.email "ci@example.com"
          echo init > README.md
          git add README.md
          git commit -q -m init

          # Untracked files in the main worktree; wt should copy only safe files by default.
          echo safe > .nvmrc
          echo secret > .env

          zsh -c "source '$GITHUB_WORKSPACE/wt.zsh'; wt feature/test >/dev/null; \
            test \"\$(git branch --show-current)\" = feature/test; \
            test -f .nvmrc; \
            test ! -f .env"

          test "$(WT_BRANCH_PREFIX='custom/' zsh -c "source '$GITHUB_WORKSPACE/wt.zsh'; _wt_branch_prefix")" = 'custom/'
          test "$(WT_BRANCH_PREFIX='' zsh -c "source '$GITHUB_WORKSPACE/wt.zsh'; _wt_branch_prefix")" = ''
          test "$(WT_BRANCH_PREFIX='custom/' zsh -c "
            source '$GITHUB_WORKSPACE/wt.zsh'
            fzf() {
              [[ \"\$*\" == *'--query=custom/'* ]] || return 1
              print -r -- 'custom/new-feature'
              return 1
            }
            _wt_prompt_for_branch
          ")" = 'custom/new-feature'

          git config wt.branchPrefix 'team/'
          test "$(zsh -c "source '$GITHUB_WORKSPACE/wt.zsh'; _wt_branch_prefix")" = 'team/'
          git config --unset wt.branchPrefix

          mkdir -p "$tmpdir/bin"
          printf '%s\n' '#!/bin/sh' 'echo RyanJamesCaldwell' > "$tmpdir/bin/gh"
          chmod +x "$tmpdir/bin/gh"
          test "$(PATH="$tmpdir/bin:$PATH" zsh -c "source '$GITHUB_WORKSPACE/wt.zsh'; _wt_branch_prefix")" = 'ryanjamescaldwell/'

          rel() {
            zsh -c "source '$GITHUB_WORKSPACE/wt.zsh'; _wt_relative_age $1 1000000000; print -r -- \$REPLY"
          }
          test "$(rel 999999990)" = 'now'
          test "$(rel 999999880)" = '2m'
          test "$(rel 999996400)" = '1h'
          test "$(rel 999827200)" = '2d'
          test "$(rel 998790400)" = '2w'
          test "$(rel 994816000)" = '2mo'
          test "$(rel 936928000)" = '2y'

          test "$(zsh -c "
            source '$GITHUB_WORKSPACE/wt.zsh'
            _wt_reflog_line_timestamp \$'0000000 1111111 Ryan Caldwell <ci@example.com> 1700000000 -0400\tbranch: Created from HEAD'
            print -r -- \$REPLY
          ")" = '1700000000'

          # The picker emits: branch, created, updated, display path, absolute path.
          picker_rows() {
            zsh -c "
              source '$GITHUB_WORKSPACE/wt.zsh'
              fzf() { cat >&2; return 130; }
              wt >/dev/null
            " 2>&1 >/dev/null
          }

          picker_rows | awk -F'\t' '
            $1 ~ /^feature\/test *$/ {
              if (NF != 5) { print "unexpected field count: " NF; exit 1 }
              if ($2 ~ /^- *$/) { print "expected a created age from the reflog"; exit 1 }
              if ($3 ~ /^- *$/) { print "expected an updated age from the reflog"; exit 1 }
              found = 1
            }
            END { if (!found) { print "feature/test row missing"; exit 1 } }
          '

          # Branches without a reflog fall back to the batched tip-commit lookup.
          zsh -c "source '$GITHUB_WORKSPACE/wt.zsh'; wt no-reflog >/dev/null"
          rm -f "$repo/.git/logs/refs/heads/no-reflog"

          picker_rows | awk -F'\t' '
            $1 ~ /^no-reflog *$/ {
              if ($2 !~ /^- *$/) { print "expected an unknown created age"; exit 1 }
              if ($3 ~ /^- *$/) { print "expected an updated age from git for-each-ref"; exit 1 }
              found = 1
            }
            END { if (!found) { print "no-reflog row missing"; exit 1 } }
          '
